<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>주문서 제출 완료</title>
  <meta name="robots" content="noindex" />
  <style>
    body{
      font-family:'Noto Sans KR',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      margin:0;padding:24px;background:#f7f7f7;display:flex;justify-content:center;
    }
    .wrap{
      width:100%;max-width:820px;background:#fff;border:1px solid #e9eef3;border-radius:12px;
      box-shadow:0 10px 25px rgba(0,0,0,0.06);padding:22px;
    }
    h1{margin:0 0 10px;font-size:22px;color:#2c3e50;text-align:center;letter-spacing:-0.2px;}
    p{margin:0;color:#556677;line-height:1.7;text-align:center;}

    .order-no{
      margin:18px 0 0;padding:18px;border:1px solid #cfd6dd;border-radius:10px;
      background:#f7f9fb;text-align:center;
    }
    .order-no .label{font-size:14px;color:#7a8a99;margin-bottom:6px;}
    .order-no .value{
      font:inherit;
      font-size:26px;font-weight:800;color:#2c3e50;letter-spacing:1px;
      font-variant-numeric:tabular-nums;
      background:#fff;border:1px solid #cfd6dd;border-radius:10px;
      padding:8px 16px;cursor:pointer;
      -webkit-user-select:all;user-select:all;
      transition:background .15s ease,color .15s ease;
    }
    .order-no .value:hover{border-color:#2c3e50;}
    .order-no .value:active{transform:translateY(1px);}
    .order-no .value.copied{background:#2c3e50;color:#fff;border-color:#2c3e50;}
    .order-no .hint{margin-top:8px;font-size:13px;color:#7a8a99;}
    .order-no .at{margin-top:8px;font-size:13px;color:#7a8a99;}

    .detail{
      margin-top:14px;padding:16px;border:1px solid #e9eef3;border-radius:10px;
      background:#fff;
    }
    .detail .d-title{font-weight:800;color:#2c3e50;margin-bottom:8px;font-size:15px;}
    .detail pre{
      margin:0;white-space:pre-wrap;word-break:break-all;
      font-family:inherit;font-size:14px;line-height:1.7;color:#556677;
    }
    .detail .note{
      margin-top:12px;padding-top:12px;border-top:1px solid #f0f3f6;
      font-size:13px;color:#7a8a99;line-height:1.6;
    }

    .box{
      margin-top:18px;padding:16px;background:#f7f9fb;border:1px solid #cfd6dd;border-radius:10px;
      color:#2c3e50;line-height:1.7;text-align:center;
    }
    .box a{color:inherit;text-decoration:underline;text-underline-offset:2px;}
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="headline">주문서 제출이 완료되었습니다.</h1>
    <p>
      작성해주신 주문 내용을 확인 후, 안내드린 방식에 따라 결제 및 출고가 진행됩니다.<br/>
      문의사항은 아래 연락처로 연락 부탁드립니다.
    </p>

    <div class="order-no" id="orderNoBox" style="display:none;">
      <div class="label">주문번호</div>
      <button type="button" class="value" id="orderNoValue">-</button>
      <div class="hint">탭하면 복사됩니다.</div>
      <div class="at" id="orderAt"></div>
    </div>

    <div class="detail" id="detailBox" style="display:none;">
      <div class="d-title">주문 내역</div>
      <pre id="detailText"></pre>
      <div class="note">
        이 내역은 주문하신 기기에만 저장됩니다. 문의 시 위 주문번호를 함께 알려주세요.
      </div>
    </div>

    <div class="box">
      <div><strong>문의</strong> : 신사업팀 이혜빈 (02-559-7594 / <a href="mailto:newbiz@parnas.co.kr">newbiz@parnas.co.kr</a>)</div>
    </div>
  </div>

<script>
function copyToClipboard(text){
  if (navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function(resolve, reject){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    ok ? resolve() : reject(new Error("copy failed"));
  });
}

(function(){
  /* 주문서 페이지가 localStorage에 저장하는 키.
     ※ 폼 이름(curry-preorder)과는 다른 값이다.
     프로젝트마다 키가 달라서 순서대로 찾는다. */
  var KEYS = ["bcc30_last_order", "bcw20_last_order", "bcw_last_order", "bcc_last_order"];
  
  var raw = null, newest = 0;
  for (var i = 0; i < KEYS.length; i++){
    try {
      var v = localStorage.getItem(KEYS[i]);
      if (!v) continue;
      var t = Date.parse(JSON.parse(v).at) || 0;
      if (t >= newest) { newest = t; raw = v; }
    } catch(e) {}
  }
  if (!raw) return; // 직접 접속 등으로 저장된 주문이 없으면 기본 화면 유지

  var saved;
  try { saved = JSON.parse(raw); } catch(e) { return; }
  if (!saved || !saved.orderNo) return;

  document.getElementById("headline").textContent =
    "주문번호 " + saved.orderNo + " 건이 접수되었습니다.";

  var btn = document.getElementById("orderNoValue");
  btn.textContent = saved.orderNo;
  btn.addEventListener("click", function(){
    copyToClipboard(saved.orderNo).then(function(){
      btn.textContent = "복사됨";
      btn.classList.add("copied");
      setTimeout(function(){
        btn.textContent = saved.orderNo;
        btn.classList.remove("copied");
      }, 1200);
    }).catch(function(){
      prompt("아래 주문번호를 길게 눌러 복사해주세요.", saved.orderNo);
    });
  });

  document.getElementById("orderAt").textContent = saved.at ? "접수일시 " + saved.at : "";
  document.getElementById("orderNoBox").style.display = "block";

  if (saved.summary) {
    var body = saved.summary.replace(/^주문번호:.*\n?/, "");
    document.getElementById("detailText").textContent = body.trim();
    document.getElementById("detailBox").style.display = "block";
  }
})();
</script>
</body>
</html>
